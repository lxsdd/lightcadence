name: Engine CI
on:
  push:
    branches: [main, 'work/**']
    paths:
      - 'engine/**'
      - 'tests/**'
      - '.github/workflows/engine-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'engine/**'
      - 'tests/**'
      - '.github/workflows/engine-ci.yml'
permissions:
  contents: read
concurrency:
  group: engine-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine-core:
    name: engine-core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile original source
        run: python3 -m compileall -q engine tests
      - name: Original engine positive and negative regressions
        run: python3 -m unittest discover -s tests -v
