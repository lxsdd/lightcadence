name: Engine CI
on:
  push:
    branches: [main, 'work/**']
    paths:
      - 'engine/**'
      - 'custom_components/**'
      - 'tests/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - '.github/workflows/engine-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'engine/**'
      - 'custom_components/**'
      - 'tests/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - '.github/workflows/engine-ci.yml'
permissions:
  contents: read
concurrency:
  group: engine-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine-core:
    name: engine-core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build local engine container (no publish)
        run: docker build -t lightcadence-ci .
      - name: Compile original engine and HA integration
        run: python3 -m compileall -q engine custom_components tests
      - name: Original engine and loopback HTTP positive and negative regressions
        run: docker run --rm --network none --read-only --cap-drop ALL -v "$PWD/tests:/app/tests:ro" lightcadence-ci python -m unittest discover -s tests -v
      - name: Pull versioned official HA runtime
        run: |
          docker pull ghcr.io/home-assistant/home-assistant:2026.11.2@sha256:493a07e8f6530fc640223f4a0a5248f20a61ca2f718bb1d31efbf08a2c5ea28f
          docker image inspect --format '{{json .RepoDigests}}' ghcr.io/home-assistant/home-assistant:2026.11.2@sha256:493a07e8f6530fc640223f4a0a5248f20a61ca2f718bb1d31efbf08a2c5ea28f
      - name: Real HA config flow and authenticated WebSocket regressions (no device I/O)
        run: |
          docker run --rm --network none --cap-drop ALL --entrypoint python -e PYTHONPATH=/src -v "$PWD:/src:ro" ghcr.io/home-assistant/home-assistant:2026.11.2@sha256:493a07e8f6530fc640223f4a0a5248f20a61ca2f718bb1d31efbf08a2c5ea28f /src/tests/ha_runtime.py
