name: Engine CI
on:
  push:
    branches: [main, 'work/**']
    paths:
      - 'engine/**'
      - 'custom_components/**'
      - 'tests/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - '.github/workflows/engine-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'engine/**'
      - 'custom_components/**'
      - 'tests/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - '.github/workflows/engine-ci.yml'
permissions:
  contents: read
concurrency:
  group: engine-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine-core:
    name: engine-core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build local engine container (no publish)
        run: docker build -t lightcadence-ci .
      - name: Compile original engine and HA integration
        run: python3 -m compileall -q engine custom_components tests
      - name: Original engine and loopback HTTP positive and negative regressions
        run: docker run --rm --network none --read-only --cap-drop ALL -v "$PWD/tests:/app/tests:ro" lightcadence-ci python -m unittest discover -s tests -v
