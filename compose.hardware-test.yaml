# Explicit owner-approved test overlay; never used by the default Compose file.
services:
  lightcadence:
    environment:
      LIGHTCADENCE_MODE: physical_candidate
      LIGHTCADENCE_DEVICE_FILE: /run/secrets/devices.json
    volumes:
      - "${LIGHTCADENCE_DEVICE_PATH:?Set the owner-local read-only device file}:/run/secrets/devices.json:ro"
